name: uc2
task: banking_triage           # Banking77 intent + reply as JSON
base_model: Qwen/Qwen2.5-1.5B-Instruct
data_dir: data/processed/uc2
output_dir: outputs/uc2
results_dir: results/uc2
max_seq_len: 1024
max_new_tokens: 150
lora: {r: 16, alpha: 32, dropout: 0.05}
train:
  epochs: 2
  lr: 2.0e-4
  per_device_batch: 4
  grad_accum: 4                # effective batch 16
  warmup_ratio: 0.03
  eval_steps: 100
  save_steps: 100
  seed: 42
eval:
  batch_size: 16
  fewshot_k: 3
  dtype: float16               # switch to float32 if fp16 outputs look broken
